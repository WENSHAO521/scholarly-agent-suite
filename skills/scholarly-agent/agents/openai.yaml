# Optional cross-runtime descriptor for this Skill, for hosts that discover
# agents/skills via an OpenAI-style manifest rather than SKILL.md frontmatter.
name: scholarly-agent
description: >
  Evidence-first academic research and writing agent for any discipline.
  One Skill with five on-demand internal modules -- execution planning
  (adaptive-model-router), research evidence (scholarly-corpus-builder),
  scholarly writing (scholarly-voice-engine), publication strategy
  (journal-fit-engine), and pre-submission peer review (peer-review-engine) -- plus a dispatcher that loads only the module(s) a
  request needs and hands data between them via versioned protocols.
instructions_file: ../SKILL.md
interface:
  display_name: "Scholarly Agent"
  short_description: "Evidence-first academic research, writing, peer review, and publication strategy"
  default_prompt: >
    Use $scholarly-agent to help with this scholarly task, loading only the
    modules it actually needs.
policy:
  allow_implicit_invocation: true
modules:
  - name: adaptive-model-router
    path: modules/adaptive-model-router/MODULE.md
    role: execution
  - name: scholarly-corpus-builder
    path: modules/scholarly-corpus-builder/MODULE.md
    role: research-intelligence
  - name: scholarly-voice-engine
    path: modules/scholarly-voice-engine/MODULE.md
    role: writing-intelligence
  - name: journal-fit-engine
    path: modules/journal-fit-engine/MODULE.md
    role: publication-intelligence
  - name: peer-review-engine
    path: modules/peer-review-engine/MODULE.md
    role: review-intelligence
capabilities:
  - decompose_scholarly_task
  - select_workflow_recipe
  - plan_execution_and_delegation
  - build_provenance_aware_corpora_and_style_profiles
  - draft_and_revise_scholarly_prose
  - evaluate_manuscript_journal_fit
  - pre_submission_peer_review_and_editorial_decision
  - propagate_shared_state_and_constraints
  - apply_final_quality_gate
constraints:
  - load_only_the_modules_a_request_needs
  - dispatcher_never_inlines_module_domain_rules
  - module_boundaries_follow_shared_capability_boundaries
  - never_run_a_fixed_all_module_pipeline_by_default
  - never_report_complete_when_a_required_module_failed_or_was_partial
  - never_fabricate_citations_metrics_or_acceptance_probabilities
references:
  - references/routing-matrix.md
  - references/orchestration-state.md
  - shared/capability-boundaries.md
  - shared/integrity-policy.md
license: ../../../LICENSE
maintained_by: scholarly-agent-suite contributors
