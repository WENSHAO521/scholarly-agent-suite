<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1000" role="img" aria-label="Scholarly Agent 如何處理一個需求：調度器先判斷要交付什麼、真正需要哪些模組，再走三條路徑之一。不需模組：簡單問題直接回答。單一模組：載入該模組的 MODULE.md，回傳結果與驗證狀態。兩個以上模組：從 15 種工作流程擇一，重用仍新鮮的產物，帶入硬性限制，依序執行各階段（每個模組到了它的階段才載入，透過有版本的協定交接），再經過六項檢查的最終品質關卡；有檢查失敗時，允許一次針對性修正後再檢查。結果為 COMPLETE、COMPLETE_WITH_LIMITATIONS 或 BLOCKED。">
  <title>Scholarly Agent：如何處理一個需求</title>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#241f18" fill-opacity="0.7"/>
    </marker>
    <style>
      .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, 'PingFang TC', 'Noto Sans TC', 'Noto Sans CJK TC', 'Microsoft JhengHei', 'Heiti TC', 'WenQuanYi Zen Hei',  monospace; }
      .sans { font-family: 'PingFang TC', 'Noto Sans TC', 'Noto Sans CJK TC', 'Microsoft JhengHei', 'Heiti TC', 'WenQuanYi Zen Hei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .ink { fill: #241f18; }
      .muted { fill: #241f18; fill-opacity: 0.62; }
      .line { stroke: #241f18; stroke-opacity: 0.55; fill: none; }
      .box { fill: #fffdf8; stroke: #241f18; stroke-opacity: 0.3; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="1000" fill="#f6f3ec"/>

  <!-- Request -->
  <rect x="360" y="20" width="240" height="40" rx="20" fill="#fffdf8" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="480" y="45" text-anchor="middle" class="mono ink" font-size="13" font-weight="700" letter-spacing="1">學術需求</text>
  <line x1="480" y1="60" x2="480" y2="88" class="line" marker-end="url(#fa)"/>

  <!-- Dispatcher -->
  <rect x="260" y="90" width="440" height="62" rx="10" fill="#eaf1f5" stroke="#3f7a9e" stroke-width="1.5"/>
  <text x="480" y="114" text-anchor="middle" class="mono" font-size="13" font-weight="700" letter-spacing="1" fill="#3f7a9e">調度器 · SKILL.md</text>
  <text x="480" y="136" text-anchor="middle" class="sans ink" font-size="12">要交付什麼？真正需要哪些模組？</text>

  <!-- Branches -->
  <path d="M330 152 L165 188" class="line" marker-end="url(#fa)"/>
  <path d="M480 152 L435 188" class="line" marker-end="url(#fa)"/>
  <path d="M630 152 L750 188" class="line" marker-end="url(#fa)"/>

  <!-- Lane 1: no module -->
  <rect x="40" y="190" width="250" height="72" rx="10" class="box"/>
  <text x="165" y="214" text-anchor="middle" class="mono ink" font-size="12.5" font-weight="700">不需模組</text>
  <text x="165" y="234" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">「APC 是什麼？」</text>
  <text x="165" y="250" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">「修正這個句子。」</text>
  <line x1="165" y1="262" x2="165" y2="298" class="line" marker-end="url(#fa)"/>
  <rect x="65" y="300" width="200" height="36" rx="18" fill="#ffffff" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="165" y="323" text-anchor="middle" class="mono ink" font-size="11.5" font-weight="700">直接回答</text>

  <!-- Lane 2: one module -->
  <rect x="310" y="190" width="250" height="72" rx="10" class="box"/>
  <text x="435" y="214" text-anchor="middle" class="mono ink" font-size="12.5" font-weight="700">單一模組</text>
  <text x="435" y="234" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">「潤飾這一段。」</text>
  <text x="435" y="250" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">「建立期刊風格檔案。」</text>
  <line x1="435" y1="262" x2="435" y2="298" class="line" marker-end="url(#fa)"/>
  <rect x="310" y="300" width="250" height="66" rx="10" class="box"/>
  <text x="435" y="324" text-anchor="middle" class="mono ink" font-size="12" font-weight="700">載入該模組的 MODULE.md</text>
  <text x="435" y="343" text-anchor="middle" class="sans ink" font-size="11">依該模組自己的流程執行</text>
  <text x="435" y="358" text-anchor="middle" class="sans ink" font-size="11">並驗證；不用工作流程、不記狀態</text>
  <line x1="435" y1="366" x2="435" y2="394" class="line" marker-end="url(#fa)"/>
  <rect x="320" y="396" width="230" height="36" rx="18" fill="#ffffff" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="435" y="419" text-anchor="middle" class="mono ink" font-size="11" font-weight="700">結果＋驗證狀態</text>

  <!-- Lane 3: workflow -->
  <rect x="580" y="190" width="340" height="72" rx="10" fill="#fffdf8" stroke="#3f7a9e" stroke-opacity="0.7"/>
  <text x="750" y="214" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#3f7a9e">兩個以上模組</text>
  <text x="750" y="234" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">「把構想寫成論文</text>
  <text x="750" y="250" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">並找合適期刊。」</text>
  <line x1="750" y1="262" x2="750" y2="298" class="line" marker-end="url(#fa)"/>

  <rect x="580" y="300" width="340" height="52" rx="10" class="box"/>
  <text x="750" y="322" text-anchor="middle" class="mono ink" font-size="12" font-weight="700">選擇工作流程</text>
  <text x="750" y="340" text-anchor="middle" class="sans ink" font-size="11">15 種擇一 · 例如 paper-from-idea、peer-review-simulation</text>
  <line x1="750" y1="352" x2="750" y2="374" class="line" marker-end="url(#fa)"/>

  <rect x="580" y="376" width="340" height="52" rx="10" class="box"/>
  <text x="750" y="398" text-anchor="middle" class="mono ink" font-size="12" font-weight="700">重用仍新鮮的產物</text>
  <text x="750" y="416" text-anchor="middle" class="sans ink" font-size="11">檔案或草稿仍有效的階段直接略過</text>
  <line x1="750" y1="428" x2="750" y2="450" class="line" marker-end="url(#fa)"/>

  <rect x="580" y="452" width="340" height="52" rx="10" class="box"/>
  <text x="750" y="474" text-anchor="middle" class="mono ink" font-size="12" font-weight="700">帶入硬性限制</text>
  <text x="750" y="492" text-anchor="middle" class="sans ink" font-size="11">只投 SSCI · 不付 APC · 字數上限：絕不丟失</text>
  <line x1="750" y1="504" x2="750" y2="526" class="line" marker-end="url(#fa)"/>

  <rect x="580" y="528" width="340" height="96" rx="10" fill="#fffdf8" stroke="#3f7a9e" stroke-opacity="0.7"/>
  <text x="750" y="550" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3f7a9e">依序執行各階段</text>
  <g class="mono" font-size="9.5" font-weight="700">
    <rect x="592" y="562" width="70" height="24" rx="12" fill="#e6efe7" stroke="#4f7d5a"/>
    <text x="627" y="578" text-anchor="middle" fill="#3d6647">語料</text>
    <rect x="674" y="562" width="70" height="24" rx="12" fill="#eaf1f5" stroke="#3f7a9e"/>
    <text x="709" y="578" text-anchor="middle" fill="#3f7a9e">寫作</text>
    <rect x="756" y="562" width="70" height="24" rx="12" fill="#f6ecdb" stroke="#b07a2a"/>
    <text x="791" y="578" text-anchor="middle" fill="#8a5e1f">期刊匹配</text>
    <rect x="838" y="562" width="70" height="24" rx="12" fill="#efe8f3" stroke="#7a5a8c"/>
    <text x="873" y="578" text-anchor="middle" fill="#6a4a7c">同儕審稿</text>
  </g>
  <line x1="662" y1="574" x2="672" y2="574" class="line" marker-end="url(#fa)"/>
  <line x1="744" y1="574" x2="754" y2="574" class="line" marker-end="url(#fa)"/>
  <line x1="826" y1="574" x2="836" y2="574" class="line" marker-end="url(#fa)"/>
  <text x="750" y="606" text-anchor="middle" class="sans ink" font-size="11">每個模組到了它的階段才載入；</text>
  <text x="750" y="619" text-anchor="middle" class="sans muted" font-size="10.5">透過有版本的協定交接</text>
  <line x1="750" y1="624" x2="750" y2="646" class="line" marker-end="url(#fa)"/>

  <!-- Quality gate -->
  <rect x="580" y="648" width="340" height="160" rx="10" fill="#fffdf8" stroke="#241f18" stroke-width="1.5"/>
  <text x="750" y="672" text-anchor="middle" class="mono ink" font-size="12.5" font-weight="700" letter-spacing="1">最終品質關卡</text>
  <g class="sans ink" font-size="11">
    <text x="602" y="696">1  交付成果存在</text>
    <text x="602" y="714">2  證據已驗證，或已聲明限制</text>
    <text x="602" y="732">3  論證完整性通過</text>
    <text x="602" y="750">4  沒有捏造或未標示的引用</text>
    <text x="602" y="768">5  期刊相關說法在需要時是最新的</text>
    <text x="602" y="786">6  使用相容的協定版本</text>
  </g>
  <text x="750" y="802" text-anchor="middle" class="sans muted" font-size="10" font-style="italic">模組的 PARTIAL 結果或未解警示絕不被掩蓋</text>
  <line x1="750" y1="808" x2="750" y2="830" class="line" marker-end="url(#fa)"/>

  <rect x="650" y="832" width="200" height="34" rx="17" fill="#241f18"/>
  <text x="750" y="854" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" letter-spacing="1" fill="#f6f3ec">六項全部通過？</text>

  <!-- Repair loop -->
  <path d="M650 849 L560 849 L560 790" class="line" marker-end="url(#fa)"/>
  <text x="604" y="843" text-anchor="middle" class="sans muted" font-size="10.5">否</text>
  <rect x="330" y="712" width="230" height="76" rx="10" class="box"/>
  <text x="445" y="736" text-anchor="middle" class="mono ink" font-size="12" font-weight="700">一次針對性修正</text>
  <text x="445" y="756" text-anchor="middle" class="sans ink" font-size="11">只修失敗的部分，最多一次；</text>
  <text x="445" y="772" text-anchor="middle" class="sans ink" font-size="11">絕不在模組間來回循環</text>
  <path d="M445 712 L445 690 L578 690" class="line" marker-end="url(#fa)"/>

  <!-- Outcomes -->
  <path d="M750 866 L750 884 L330 884 L330 904" class="line" marker-end="url(#fa)"/>
  <path d="M750 884 L560 884 L560 904" class="line" marker-end="url(#fa)"/>
  <path d="M750 884 L790 884 L790 904" class="line" marker-end="url(#fa)"/>
  <text x="768" y="879" class="sans muted" font-size="10.5">結果（最多修正一次之後）</text>
  <g class="mono" font-size="11.5" font-weight="700">
    <rect x="235" y="906" width="190" height="32" rx="16" fill="#e6efe7" stroke="#4f7d5a"/>
    <text x="330" y="927" text-anchor="middle" fill="#3d6647">COMPLETE</text>
    <rect x="440" y="906" width="240" height="32" rx="16" fill="#f6ecdb" stroke="#b07a2a"/>
    <text x="560" y="927" text-anchor="middle" fill="#8a5e1f">COMPLETE_WITH_LIMITATIONS</text>
    <rect x="695" y="906" width="190" height="32" rx="16" fill="#f4e2df" stroke="#a8473b"/>
    <text x="790" y="927" text-anchor="middle" fill="#8e3a30">BLOCKED</text>
  </g>
  <g class="sans muted" font-size="10.5" text-anchor="middle">
    <text x="330" y="954">所有檢查通過</text>
    <text x="560" y="954">缺口明確說出，不隱藏</text>
    <text x="790" y="954">缺少證據、工具失敗或協定不符</text>
  </g>
  <text x="480" y="984" text-anchor="middle" class="sans muted" font-size="10.5" font-style="italic">狀態模型：skills/scholarly-agent/references/orchestration-state.md</text>
</svg>
