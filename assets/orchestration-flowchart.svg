<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-label="Flowchart of how Scholarly Agent decides what to do: check whether two or more specialists are genuinely needed; if not, route directly to one specialist with no orchestration; if so, select a workflow recipe, reuse fresh existing artifacts instead of rebuilding them, propagate hard constraints, invoke only the minimal specialist set in recipe order, allow at most one bounded repair pass, then apply a final quality gate that branches into COMPLETE, COMPLETE_WITH_LIMITATIONS, or a BLOCKED state.">
  <title>Scholarly Agent -- orchestration decision flowchart</title>
  <defs>
    <marker id="ofArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#241f18"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1400" fill="#f6f3ec"/>

  <!-- start -->
  <rect x="330" y="16" width="240" height="40" rx="20" fill="none" stroke="#241f18" stroke-opacity="0.55"/>
  <text x="450" y="41" text-anchor="middle" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1" fill="#241f18">SCHOLARLY REQUEST</text>
  <line x1="450" y1="56" x2="450" y2="90" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>

  <!-- decision 1 -->
  <polygon points="450,92 610,168 450,244 290,168" fill="none" stroke="#a65d3f" stroke-width="1.6"/>
  <text x="450" y="160" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="600" fill="#a65d3f">TWO OR MORE SPECIALISTS</text>
  <text x="450" y="176" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="600" fill="#a65d3f">GENUINELY NEEDED?</text>

  <!-- NO branch -->
  <line x1="610" y1="168" x2="720" y2="168" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>
  <text x="665" y="158" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#241f18" fill-opacity="0.7">no</text>
  <rect x="640" y="188" width="230" height="76" rx="9" fill="none" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="755" y="212" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#241f18">ROUTE DIRECTLY TO</text>
  <text x="755" y="228" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#241f18">ONE SPECIALIST</text>
  <text x="755" y="248" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#241f18" fill-opacity="0.6">no orchestration overhead</text>
  <line x1="755" y1="264" x2="755" y2="300" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>
  <rect x="670" y="302" width="170" height="38" rx="19" fill="none" stroke="#241f18" stroke-opacity="0.55"/>
  <text x="755" y="326" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1" fill="#241f18">DONE</text>

  <!-- YES branch continues down -->
  <line x1="450" y1="244" x2="450" y2="280" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>
  <text x="466" y="266" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#241f18" fill-opacity="0.7">yes</text>

  <!-- select recipe -->
  <rect x="270" y="282" width="360" height="82" rx="9" fill="none" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="450" y="308" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" fill="#241f18">SELECT WORKFLOW RECIPE</text>
  <text x="450" y="328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#241f18" fill-opacity="0.65">paper-from-idea, revise-manuscript,</text>
  <text x="450" y="344" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#241f18" fill-opacity="0.65">journal-selection, book-project, ... (workflows/)</text>
  <line x1="450" y1="364" x2="450" y2="398" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>

  <!-- reuse check decision -->
  <polygon points="450,400 630,460 450,520 270,460" fill="none" stroke="#a65d3f" stroke-width="1.6"/>
  <text x="450" y="452" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#a65d3f">EXISTING ARTIFACT</text>
  <text x="450" y="468" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#a65d3f">FRESH &amp; REUSABLE?</text>

  <line x1="630" y1="460" x2="720" y2="460" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>
  <text x="672" y="450" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#241f18" fill-opacity="0.7">yes</text>
  <rect x="640" y="478" width="230" height="60" rx="9" fill="none" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="755" y="502" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#241f18">REUSE ARTIFACT</text>
  <text x="755" y="520" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#241f18" fill-opacity="0.6">skip rebuilding this stage</text>

  <line x1="450" y1="520" x2="450" y2="556" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>
  <text x="422" y="542" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#241f18" fill-opacity="0.7">no / stale</text>

  <line x1="755" y1="538" x2="755" y2="576" stroke="#241f18" stroke-opacity="0.45" stroke-dasharray="4 4"/>
  <line x1="755" y1="576" x2="596" y2="576" stroke="#241f18" stroke-opacity="0.45" stroke-dasharray="4 4" marker-end="url(#ofArrow)"/>

  <!-- propagate constraints -->
  <rect x="270" y="558" width="360" height="60" rx="9" fill="none" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="450" y="582" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" fill="#241f18">PROPAGATE HARD CONSTRAINTS</text>
  <text x="450" y="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#241f18" fill-opacity="0.65">e.g. SSCI only, no APC, word limit -- never silently dropped</text>
  <line x1="450" y1="618" x2="450" y2="652" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>

  <!-- invoke minimal set -->
  <rect x="230" y="654" width="440" height="100" rx="10" fill="none" stroke="#3f7a9e" stroke-width="2"/>
  <text x="450" y="682" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#3f7a9e">INVOKE MINIMAL SPECIALIST SET</text>
  <text x="450" y="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10.5" fill="#241f18" fill-opacity="0.7">in the recipe's stage order --</text>
  <text x="450" y="716" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10.5" fill="#241f18" fill-opacity="0.7">Router / Corpus Builder / Voice Engine / Journal Fit</text>
  <text x="450" y="734" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-style="italic" fill="#241f18" fill-opacity="0.55">never a fixed all-four pipeline by default</text>
  <line x1="450" y1="754" x2="450" y2="790" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>

  <!-- quality gate decision -->
  <rect x="200" y="792" width="500" height="150" rx="10" fill="none" stroke="#241f18" stroke-opacity="0.35"/>
  <text x="220" y="816" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="600" letter-spacing="1" fill="#241f18">FINAL QUALITY GATE</text>
  <line x1="220" y1="826" x2="680" y2="826" stroke="#241f18" stroke-opacity="0.2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" fill="#241f18">
    <text x="220" y="850"><tspan font-family="SFMono-Regular,Consolas,monospace" fill-opacity="0.55">1</tspan><tspan dx="10">deliverable exists</tspan></text>
    <text x="220" y="872"><tspan font-family="SFMono-Regular,Consolas,monospace" fill-opacity="0.55">2</tspan><tspan dx="10">evidence verified or limitation declared</tspan></text>
    <text x="220" y="894"><tspan font-family="SFMono-Regular,Consolas,monospace" fill-opacity="0.55">3</tspan><tspan dx="10">argument integrity passed</tspan></text>
    <text x="460" y="850"><tspan font-family="SFMono-Regular,Consolas,monospace" fill-opacity="0.55">4</tspan><tspan dx="10">no fabricated/unlabeled citations</tspan></text>
    <text x="460" y="872"><tspan font-family="SFMono-Regular,Consolas,monospace" fill-opacity="0.55">5</tspan><tspan dx="10">journal claims current where required</tspan></text>
    <text x="460" y="894"><tspan font-family="SFMono-Regular,Consolas,monospace" fill-opacity="0.55">6</tspan><tspan dx="10">compatible protocol versions used</tspan></text>
  </g>
  <text x="450" y="924" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10.5" font-style="italic" fill="#241f18" fill-opacity="0.6">a specialist's PARTIAL result or unresolved flag must survive here, never be laundered</text>
  <line x1="450" y1="942" x2="450" y2="978" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>

  <polygon points="450,980 640,1058 450,1136 260,1058" fill="none" stroke="#a65d3f" stroke-width="1.6"/>
  <text x="450" y="1050" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="600" fill="#a65d3f">ALL SIX CHECKS</text>
  <text x="450" y="1066" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="600" fill="#a65d3f">PASS?</text>

  <!-- repair loop, bounded -->
  <line x1="640" y1="1058" x2="740" y2="1058" stroke="#241f18" stroke-opacity="0.6" marker-end="url(#ofArrow)"/>
  <text x="690" y="1048" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#241f18" fill-opacity="0.7">not yet</text>
  <rect x="700" y="1078" width="190" height="88" rx="9" fill="none" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="795" y="1102" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#241f18">ONE TARGETED</text>
  <text x="795" y="1118" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#241f18">REPAIR PASS</text>
  <text x="795" y="1138" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#241f18" fill-opacity="0.6">bounded: at most once --</text>
  <text x="795" y="1152" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#241f18" fill-opacity="0.6">no repeated Voice/Journal cycling</text>
  <line x1="795" y1="1078" x2="795" y2="1040" stroke="#241f18" stroke-opacity="0.45" stroke-dasharray="4 4"/>
  <line x1="795" y1="1040" x2="642" y2="1040" stroke="#241f18" stroke-opacity="0.45" stroke-dasharray="4 4" marker-end="url(#ofArrow)"/>

  <!-- yes branch to three outcomes -->
  <line x1="450" y1="1136" x2="450" y2="1174" stroke="#241f18" stroke-opacity="0.6"/>
  <text x="466" y="1156" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#241f18" fill-opacity="0.7">yes / repaired</text>

  <line x1="180" y1="1174" x2="720" y2="1174" stroke="#241f18" stroke-opacity="0.5"/>
  <line x1="180" y1="1174" x2="180" y2="1206" stroke="#241f18" stroke-opacity="0.5" marker-end="url(#ofArrow)"/>
  <line x1="450" y1="1174" x2="450" y2="1206" stroke="#241f18" stroke-opacity="0.5" marker-end="url(#ofArrow)"/>
  <line x1="720" y1="1174" x2="720" y2="1206" stroke="#241f18" stroke-opacity="0.5" marker-end="url(#ofArrow)"/>

  <!-- outcome: COMPLETE -->
  <rect x="70" y="1208" width="220" height="72" rx="12" fill="none" stroke="#3f7a9e" stroke-width="2"/>
  <text x="180" y="1240" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12.5" font-weight="600" fill="#3f7a9e">COMPLETE</text>
  <text x="180" y="1258" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#241f18" fill-opacity="0.6">every check passed cleanly</text>

  <!-- outcome: COMPLETE_WITH_LIMITATIONS -->
  <rect x="340" y="1208" width="220" height="72" rx="12" fill="none" stroke="#241f18" stroke-opacity="0.55"/>
  <text x="450" y="1235" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="600" fill="#241f18">COMPLETE_WITH_</text>
  <text x="450" y="1251" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="600" fill="#241f18">LIMITATIONS</text>
  <text x="450" y="1269" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#241f18" fill-opacity="0.6">checks 2-5 recoverable via a stated limitation</text>

  <!-- outcome: BLOCKED -->
  <rect x="610" y="1208" width="220" height="72" rx="12" fill="none" stroke="#a65d3f" stroke-width="1.6"/>
  <text x="720" y="1235" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="600" fill="#a65d3f">BLOCKED_BY_EVIDENCE</text>
  <text x="720" y="1251" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="600" fill="#a65d3f">/ BLOCKED_BY_TOOL</text>
  <text x="720" y="1269" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#241f18" fill-opacity="0.6">deliverable missing or protocol mismatch</text>

  <text x="450" y="1330" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic" fill="#241f18" fill-opacity="0.6">See skills/scholarly-agent/references/orchestration-state.md for the exact state model.</text>
</svg>
