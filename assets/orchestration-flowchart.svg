<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1000" role="img" aria-label="How the Scholarly Agent handles a request. The dispatcher first asks what the deliverable is and which modules it really needs, then takes one of three paths. No module: a trivial question is answered directly. One module: it loads that module's MODULE.md and returns the module's result with its own validation state. Two or more modules: it selects one of 15 workflow recipes, reuses fresh artifacts, carries hard constraints forward, runs the stages loading each module only when its stage starts and handing off through versioned protocols, then applies a final quality gate of six checks. If a check fails, one targeted repair pass is allowed before the gate is applied again. The workflow ends as COMPLETE, COMPLETE_WITH_LIMITATIONS, or BLOCKED.">
  <title>Scholarly Agent -- how a request is handled</title>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#241f18" fill-opacity="0.7"/>
    </marker>
    <style>
      .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .ink { fill: #241f18; }
      .muted { fill: #241f18; fill-opacity: 0.62; }
      .line { stroke: #241f18; stroke-opacity: 0.55; fill: none; }
      .box { fill: #fffdf8; stroke: #241f18; stroke-opacity: 0.3; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="1000" fill="#f6f3ec"/>

  <!-- Request -->
  <rect x="360" y="20" width="240" height="40" rx="20" fill="#fffdf8" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="480" y="45" text-anchor="middle" class="mono ink" font-size="13" font-weight="700" letter-spacing="1">SCHOLARLY REQUEST</text>
  <line x1="480" y1="60" x2="480" y2="88" class="line" marker-end="url(#fa)"/>

  <!-- Dispatcher -->
  <rect x="260" y="90" width="440" height="62" rx="10" fill="#eaf1f5" stroke="#3f7a9e" stroke-width="1.5"/>
  <text x="480" y="114" text-anchor="middle" class="mono" font-size="13" font-weight="700" letter-spacing="1" fill="#3f7a9e">DISPATCHER · SKILL.md</text>
  <text x="480" y="136" text-anchor="middle" class="sans ink" font-size="12">What is the deliverable? Which modules does it really need?</text>

  <!-- Branches -->
  <path d="M330 152 L165 188" class="line" marker-end="url(#fa)"/>
  <path d="M480 152 L435 188" class="line" marker-end="url(#fa)"/>
  <path d="M630 152 L750 188" class="line" marker-end="url(#fa)"/>

  <!-- Lane 1: no module -->
  <rect x="40" y="190" width="250" height="72" rx="10" class="box"/>
  <text x="165" y="214" text-anchor="middle" class="mono ink" font-size="12.5" font-weight="700">NO MODULE</text>
  <text x="165" y="234" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">"What does APC mean?"</text>
  <text x="165" y="250" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">"Fix this sentence."</text>
  <line x1="165" y1="262" x2="165" y2="298" class="line" marker-end="url(#fa)"/>
  <rect x="65" y="300" width="200" height="36" rx="18" fill="#ffffff" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="165" y="323" text-anchor="middle" class="mono ink" font-size="11.5" font-weight="700">ANSWER DIRECTLY</text>

  <!-- Lane 2: one module -->
  <rect x="310" y="190" width="250" height="72" rx="10" class="box"/>
  <text x="435" y="214" text-anchor="middle" class="mono ink" font-size="12.5" font-weight="700">ONE MODULE</text>
  <text x="435" y="234" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">"Polish this paragraph."</text>
  <text x="435" y="250" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">"Build a journal style profile."</text>
  <line x1="435" y1="262" x2="435" y2="298" class="line" marker-end="url(#fa)"/>
  <rect x="310" y="300" width="250" height="66" rx="10" class="box"/>
  <text x="435" y="324" text-anchor="middle" class="mono ink" font-size="12" font-weight="700">LOAD ITS MODULE.md</text>
  <text x="435" y="343" text-anchor="middle" class="sans ink" font-size="11">follow that module's own workflow</text>
  <text x="435" y="358" text-anchor="middle" class="sans ink" font-size="11">and validation; no recipe, no state</text>
  <line x1="435" y1="366" x2="435" y2="394" class="line" marker-end="url(#fa)"/>
  <rect x="320" y="396" width="230" height="36" rx="18" fill="#ffffff" stroke="#241f18" stroke-opacity="0.45"/>
  <text x="435" y="419" text-anchor="middle" class="mono ink" font-size="11" font-weight="700">RESULT + VALIDATION STATE</text>

  <!-- Lane 3: workflow -->
  <rect x="580" y="190" width="340" height="72" rx="10" fill="#fffdf8" stroke="#3f7a9e" stroke-opacity="0.7"/>
  <text x="750" y="214" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#3f7a9e">TWO OR MORE MODULES</text>
  <text x="750" y="234" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">"Turn my idea into a paper</text>
  <text x="750" y="250" text-anchor="middle" class="sans muted" font-size="11" font-style="italic">and find a journal."</text>
  <line x1="750" y1="262" x2="750" y2="298" class="line" marker-end="url(#fa)"/>

  <rect x="580" y="300" width="340" height="52" rx="10" class="box"/>
  <text x="750" y="322" text-anchor="middle" class="mono ink" font-size="12" font-weight="700">SELECT WORKFLOW RECIPE</text>
  <text x="750" y="340" text-anchor="middle" class="sans ink" font-size="11">1 of 15 · e.g. paper-from-idea, pre-submission-review</text>
  <line x1="750" y1="352" x2="750" y2="374" class="line" marker-end="url(#fa)"/>

  <rect x="580" y="376" width="340" height="52" rx="10" class="box"/>
  <text x="750" y="398" text-anchor="middle" class="mono ink" font-size="12" font-weight="700">REUSE FRESH ARTIFACTS</text>
  <text x="750" y="416" text-anchor="middle" class="sans ink" font-size="11">skip a stage whose profile or draft is still current</text>
  <line x1="750" y1="428" x2="750" y2="450" class="line" marker-end="url(#fa)"/>

  <rect x="580" y="452" width="340" height="52" rx="10" class="box"/>
  <text x="750" y="474" text-anchor="middle" class="mono ink" font-size="12" font-weight="700">CARRY HARD CONSTRAINTS</text>
  <text x="750" y="492" text-anchor="middle" class="sans ink" font-size="11">SSCI only · no APC · word limit -- never dropped</text>
  <line x1="750" y1="504" x2="750" y2="526" class="line" marker-end="url(#fa)"/>

  <rect x="580" y="528" width="340" height="96" rx="10" fill="#fffdf8" stroke="#3f7a9e" stroke-opacity="0.7"/>
  <text x="750" y="550" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3f7a9e">RUN THE STAGES</text>
  <g class="mono" font-size="9.5" font-weight="700">
    <rect x="592" y="562" width="70" height="24" rx="12" fill="#e6efe7" stroke="#4f7d5a"/>
    <text x="627" y="578" text-anchor="middle" fill="#3d6647">CORPUS</text>
    <rect x="674" y="562" width="70" height="24" rx="12" fill="#eaf1f5" stroke="#3f7a9e"/>
    <text x="709" y="578" text-anchor="middle" fill="#3f7a9e">VOICE</text>
    <rect x="756" y="562" width="70" height="24" rx="12" fill="#f6ecdb" stroke="#b07a2a"/>
    <text x="791" y="578" text-anchor="middle" fill="#8a5e1f">JOURNAL FIT</text>
    <rect x="838" y="562" width="70" height="24" rx="12" fill="#efe8f3" stroke="#7a5a8c"/>
    <text x="873" y="578" text-anchor="middle" fill="#6a4a7c">PEER REVIEW</text>
  </g>
  <line x1="662" y1="574" x2="672" y2="574" class="line" marker-end="url(#fa)"/>
  <line x1="744" y1="574" x2="754" y2="574" class="line" marker-end="url(#fa)"/>
  <line x1="826" y1="574" x2="836" y2="574" class="line" marker-end="url(#fa)"/>
  <text x="750" y="606" text-anchor="middle" class="sans ink" font-size="11">load each module only when its stage starts;</text>
  <text x="750" y="619" text-anchor="middle" class="sans muted" font-size="10.5">hand off through versioned protocols</text>
  <line x1="750" y1="624" x2="750" y2="646" class="line" marker-end="url(#fa)"/>

  <!-- Quality gate -->
  <rect x="580" y="648" width="340" height="160" rx="10" fill="#fffdf8" stroke="#241f18" stroke-width="1.5"/>
  <text x="750" y="672" text-anchor="middle" class="mono ink" font-size="12.5" font-weight="700" letter-spacing="1">FINAL QUALITY GATE</text>
  <g class="sans ink" font-size="11">
    <text x="602" y="696">1  deliverable exists</text>
    <text x="602" y="714">2  evidence verified or limitation declared</text>
    <text x="602" y="732">3  argument integrity passed</text>
    <text x="602" y="750">4  no fabricated or unlabelled citations</text>
    <text x="602" y="768">5  journal claims current where required</text>
    <text x="602" y="786">6  compatible protocol versions used</text>
  </g>
  <text x="750" y="802" text-anchor="middle" class="sans muted" font-size="10" font-style="italic">a module's PARTIAL result or open flag is never laundered</text>
  <line x1="750" y1="808" x2="750" y2="830" class="line" marker-end="url(#fa)"/>

  <rect x="650" y="832" width="200" height="34" rx="17" fill="#241f18"/>
  <text x="750" y="854" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" letter-spacing="1" fill="#f6f3ec">ALL SIX PASS?</text>

  <!-- Repair loop -->
  <path d="M650 849 L560 849 L560 790" class="line" marker-end="url(#fa)"/>
  <text x="604" y="843" text-anchor="middle" class="sans muted" font-size="10.5">no</text>
  <rect x="330" y="712" width="230" height="76" rx="10" class="box"/>
  <text x="445" y="736" text-anchor="middle" class="mono ink" font-size="12" font-weight="700">ONE TARGETED REPAIR</text>
  <text x="445" y="756" text-anchor="middle" class="sans ink" font-size="11">fix only what failed, at most once;</text>
  <text x="445" y="772" text-anchor="middle" class="sans ink" font-size="11">never cycle between modules</text>
  <path d="M445 712 L445 690 L578 690" class="line" marker-end="url(#fa)"/>

  <!-- Outcomes -->
  <path d="M750 866 L750 884 L330 884 L330 904" class="line" marker-end="url(#fa)"/>
  <path d="M750 884 L560 884 L560 904" class="line" marker-end="url(#fa)"/>
  <path d="M750 884 L790 884 L790 904" class="line" marker-end="url(#fa)"/>
  <text x="768" y="879" class="sans muted" font-size="10.5">outcome, after at most one repair</text>
  <g class="mono" font-size="11.5" font-weight="700">
    <rect x="235" y="906" width="190" height="32" rx="16" fill="#e6efe7" stroke="#4f7d5a"/>
    <text x="330" y="927" text-anchor="middle" fill="#3d6647">COMPLETE</text>
    <rect x="440" y="906" width="240" height="32" rx="16" fill="#f6ecdb" stroke="#b07a2a"/>
    <text x="560" y="927" text-anchor="middle" fill="#8a5e1f">COMPLETE_WITH_LIMITATIONS</text>
    <rect x="695" y="906" width="190" height="32" rx="16" fill="#f4e2df" stroke="#a8473b"/>
    <text x="790" y="927" text-anchor="middle" fill="#8e3a30">BLOCKED</text>
  </g>
  <g class="sans muted" font-size="10.5" text-anchor="middle">
    <text x="330" y="954">every check passed</text>
    <text x="560" y="954">a gap is stated, not hidden</text>
    <text x="790" y="954">missing evidence, tool failure, or protocol mismatch</text>
  </g>
  <text x="480" y="984" text-anchor="middle" class="sans muted" font-size="10.5" font-style="italic">State model: skills/scholarly-agent/references/orchestration-state.md</text>
</svg>
